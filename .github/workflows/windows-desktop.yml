name: Windows Desktop Build

on:
  push:
    branches:
      - updates
    paths:
      - "beforetheFlatline/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Check out updates branch
        uses: actions/checkout@v4
        with:
          ref: updates

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot 4.7.2 .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Verify build tools
        shell: pwsh
        run: |
          godot --version
          dotnet --list-sdks

      - name: Stamp build version into project
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $version = "windows-preview-$env:GITHUB_RUN_NUMBER"
          $projectPath = "project.godot"
          $content = Get-Content -LiteralPath $projectPath -Raw
          $versionLine = "config/version=`"$version`""

          if ($content -match '(?m)^config/version=') {
            $content = [regex]::Replace($content, '(?m)^config/version=.*        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $godot = (Get-Command godot -ErrorAction Stop).Source
          .\Build-Windows.ps1 -GodotPath $godot

      - name: Verify executable and calculate checksum
        id: executable
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $exe = Get-Item -LiteralPath "builds/windows/BeforeTheFlatline.exe" -ErrorAction Stop
          if ($exe.Length -lt 1MB) {
            throw "The exported executable is unexpectedly small ($($exe.Length) bytes)."
          }

          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          "sha256=$($hash.Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$($exe.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Executable: $($exe.FullName)"
          Write-Host "Size: $([Math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeforeTheFlatline-Windows-x64
          path: beforetheFlatline/builds/windows/BeforeTheFlatline.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Before The Flatline - Windows Preview #${{ github.run_number }}
          body: |
            Automated Windows x64 standalone build from the `updates` branch.

            - Executable: `BeforeTheFlatline.exe`
            - Platform: Windows 10/11 x64
            - Engine: Godot 4.7.2 .NET
            - Commit: `${{ github.sha }}`

            This is a preview build for testing. Extract/download the executable and run it on Windows.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: beforetheFlatline/builds/windows/BeforeTheFlatline.exe
, $versionLine)
          }
          else {
            $marker = 'config/name="BeforeTheFlatline : Original"'
            if (-not $content.Contains($marker)) {
              throw "Could not find the application name setting to stamp the build version."
            }
            $content = $content.Replace($marker, "$marker`r`n$versionLine")
          }

          [System.IO.File]::WriteAllText(
            (Resolve-Path -LiteralPath $projectPath).Path,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build standalone executable
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $godot = (Get-Command godot -ErrorAction Stop).Source
          .\Build-Windows.ps1 -GodotPath $godot

      - name: Verify executable and calculate checksum
        id: executable
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $exe = Get-Item -LiteralPath "builds/windows/BeforeTheFlatline.exe" -ErrorAction Stop
          if ($exe.Length -lt 1MB) {
            throw "The exported executable is unexpectedly small ($($exe.Length) bytes)."
          }

          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          "sha256=$($hash.Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$($exe.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Executable: $($exe.FullName)"
          Write-Host "Size: $([Math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeforeTheFlatline-Windows-x64
          path: beforetheFlatline/builds/windows/BeforeTheFlatline.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Before The Flatline - Windows Preview #${{ github.run_number }}
          body: |
            Automated Windows x64 standalone build from the `updates` branch.

            - Executable: `BeforeTheFlatline.exe`
            - Platform: Windows 10/11 x64
            - Engine: Godot 4.7.2 .NET
            - Commit: `${{ github.sha }}`

            This is a preview build for testing. Extract/download the executable and run it on Windows.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: beforetheFlatline/builds/windows/BeforeTheFlatline.exe
