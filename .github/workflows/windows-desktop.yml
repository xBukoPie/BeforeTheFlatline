name: Windows Desktop Build

on:
  push:
    branches:
      - updates
    paths:
      - "beforetheFlatline/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Check out updates branch
        uses: actions/checkout@v4
        with:
          ref: updates

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot 4.7.2 .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Verify build tools
        shell: pwsh
        run: |
          godot --version
          dotnet --list-sdks

      - name: Stamp build version into project
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $version = "windows-preview-$env:GITHUB_RUN_NUMBER"
          $projectPath = "project.godot"
          $content = Get-Content -LiteralPath $projectPath -Raw
          $versionLine = 'config/version="' + $version + '"'
          $existingVersionLine = 'config/version='

          if ($content.Contains($existingVersionLine)) {
            $lines = $content -split "`r?`n"
            for ($index = 0; $index -lt $lines.Length; $index++) {
              if ($lines[$index].StartsWith($existingVersionLine)) {
                $lines[$index] = $versionLine
              }
            }
            $content = $lines -join "`r`n"
          }
          else {
            $marker = 'config/name="BeforeTheFlatline : Original"'
            if (-not $content.Contains($marker)) {
              throw "Could not find the application name setting to stamp the build version."
            }
            $content = $content.Replace($marker, $marker + "`r`n" + $versionLine)
          }

          $absoluteProjectPath = (Resolve-Path -LiteralPath $projectPath).Path
          [System.IO.File]::WriteAllText(
            $absoluteProjectPath,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build standalone executable
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $godot = (Get-Command godot -ErrorAction Stop).Source
          .\Build-Windows.ps1 -GodotPath $godot

      - name: Verify executable and calculate checksum
        id: executable
        shell: pwsh
        working-directory: beforetheFlatline
        run: |
          $exe = Get-Item -LiteralPath "builds/windows/BeforeTheFlatline.exe" -ErrorAction Stop
          if ($exe.Length -lt 1MB) {
            throw "The exported executable is unexpectedly small ($($exe.Length) bytes)."
          }

          $hash = Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256
          "sha256=$($hash.Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$($exe.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Executable: $($exe.FullName)"
          Write-Host "Size: $([Math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeforeTheFlatline-Windows-x64
          path: beforetheFlatline/builds/windows/BeforeTheFlatline.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows preview release
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'Release: Before The Flatline Windows Preview' }}"
        shell: pwsh
        working-directory: beforetheFlatline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $exePath = (Resolve-Path -LiteralPath "builds/windows/BeforeTheFlatline.exe").Path
          $sha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
          $tagName = "windows-preview-$env:GITHUB_RUN_NUMBER"

          $releaseNotes = @(
            "## Included"
            "- Fixed the Settings credits navigation so Asset Credits opens as a nested overlay."
            "- Returning from Asset Credits restores Team Credits; returning to Settings releases the overlay cleanly."
            "- Includes the current credits-unlock and SuperUser assessment updates."
            ""
            "## Build"
            "- Windows x64 standalone executable."
            "- SHA-256: $sha256"
          ) -join "`n"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $payload = @{
            tag_name = $tagName
            target_commitish = $env:GITHUB_SHA
            name = "Before The Flatline - Windows Preview"
            body = $releaseNotes
            draft = $false
            prerelease = $true
            generate_release_notes = $false
          } | ConvertTo-Json -Depth 5

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $release = Invoke-RestMethod -Method Post -Uri $releaseUri -Headers $headers -ContentType "application/vnd.github+json" -Body $payload

          if (-not $release.id) {
            throw "GitHub did not return a release ID."
          }

          $assetUri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=BeforeTheFlatline.exe"
          $asset = Invoke-RestMethod -Method Post -Uri $assetUri -Headers $headers -InFile $exePath -ContentType "application/octet-stream"

          if (-not $asset.browser_download_url) {
            throw "The executable upload did not return a browser download URL."
          }

          Write-Host "Published release: $($release.html_url)"
          Write-Host "Uploaded executable: $($asset.browser_download_url)"
          Write-Host "SHA-256: $sha256"

